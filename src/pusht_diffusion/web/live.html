<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Push-T · 策略实验台</title>
<style>
:root{--paper:#eef4fa;--ink:#182c48;--blue:#2458b4;--rule:#bfd1e4;--green:#3a826e;--yellow:#f0c359}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 'Avenir Next','PingFang SC',sans-serif}main{max-width:1120px;margin:auto;padding:28px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px}h1{font-size:28px;margin:0;font-weight:650;letter-spacing:-.7px}header p{font-size:14px;color:#526b88}.bench{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:34px;margin-top:24px}.arena{background:white;padding:20px;border:1px solid var(--rule);border-radius:18px}canvas{width:100%;height:auto;display:block;touch-action:none;cursor:grab;border-radius:10px}canvas:active{cursor:grabbing}.caption{font-size:14px;color:#526b88;margin:16px 0 0}aside{padding-top:8px}h2{font-size:18px;margin:0 0 14px}button,select{font:inherit;border:1px solid var(--rule);border-radius:9px;padding:10px 14px;background:white;color:var(--ink);width:100%}button{cursor:pointer}button:hover{background:#e1ebf8}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue);margin:14px 0}.primary:hover{background:#1b4694}.row{display:flex;gap:8px}dl{margin:26px 0;border-top:1px solid var(--rule)}dl div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule)}dt{color:#526b88}dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}.hint{font-size:13px;color:#526b88}#error{min-height:1.5em;color:#a32b39;font-size:14px}#connection{color:var(--green)}.legend{display:flex;gap:20px;font-size:13px;margin-top:12px}.dot{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:50%}.note{margin-top:22px;padding:14px;border-left:3px solid var(--yellow);font-size:14px;background:#fffaf0}@media(max-width:720px){main{padding:16px}header{display:block}.bench{grid-template-columns:1fr;gap:20px}.arena{padding:8px}aside{padding:0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{margin:0}dl{margin:18px 0}header p{margin:8px 0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main><header><h1>Push-T 策略实验台</h1><p id="connection" aria-live="polite">正在连接本地仿真…</p></header><div class="bench"><section><div class="arena"><canvas id="arena" width="384" height="384" tabindex="0" aria-label="Push-T 实时场景。拖动 T 块，或聚焦后用方向键移动。"></canvas></div><p class="caption">把 T 块推入绿色目标。拖动 T 块后，策略会重新观察并规划；方向键可微调位置。</p><div class="legend"><span><i class="dot" style="background:#5b8cb8"></i>当前物体</span><span><i class="dot" style="background:#93d39d"></i>目标区域</span></div></section><aside><h2>观察与干预</h2><div class="controls"><select id="model" aria-label="选择策略"><option value="act">ACT · 载入中</option><option value="unet" disabled>U-Net · 待实现</option><option value="dit" disabled>DiT · 待实现</option></select><button id="pause" class="primary" disabled>继续运行</button></div><p class="hint">ACT（Action Chunking with Transformers，基于 Transformer 的动作分块）；U-Net（U-shaped Network，U 形网络）；DiT（Diffusion Transformer，扩散 Transformer）。</p><div class="row"><button id="same">重放此场景</button><button id="new">新场景</button></div><dl><div><dt>覆盖率</dt><dd id="coverage">—</dd></div><div><dt>执行步数</dt><dd id="steps">0</dd></div><div><dt>规划耗时</dt><dd id="latency">—</dd></div><div><dt>场景种子</dt><dd id="seed">—</dd></div></dl><div class="note">自由试玩会持续运行，达到目标后也可继续干预。此页不产生正式实验分数。</div><p id="error" role="alert"></p></aside></div></main>
<script>
const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');let state=null,held=false,pendingImage=null,drawing=false;
const socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/live`);
function send(msg){if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(msg));}
async function draw(){if(drawing)return;drawing=true;while(pendingImage){const src=pendingImage;pendingImage=null;const img=new Image();img.src='data:image/jpeg;base64,'+src;await img.decode();ctx.drawImage(img,0,0,384,384);}drawing=false;}
socket.onopen=()=>{$('connection').textContent='本地仿真已连接';$('pause').disabled=false;};socket.onclose=()=>{$('connection').textContent='连接已断开，刷新页面重连';$('pause').disabled=true;};
socket.onmessage=event=>{const msg=JSON.parse(event.data);if(msg.type==='error'){$('error').textContent=msg.message;return;}state=msg;$('error').textContent='';pendingImage=msg.image;draw();$('coverage').textContent=(100*msg.coverage).toFixed(1)+'%';$('steps').textContent=msg.steps;$('latency').textContent=msg.latency_ms.toFixed(1)+' ms';$('seed').textContent=msg.seed;$('pause').textContent=msg.paused?'继续运行':'暂停';$('model').value=msg.model;for(const item of msg.models){const option=$('model').querySelector(`option[value="${item.name}"]`);option.disabled=!item.available;option.textContent=`${item.name==='act'?'ACT':item.name==='unet'?'U-Net':'DiT'} · ${item.status}`;}};
$('pause').onclick=()=>send({type:'pause',paused:state?!state.paused:false});$('same').onclick=()=>send({type:'reset',mode:'same'});$('new').onclick=()=>send({type:'reset',mode:'new'});$('model').onchange=e=>send({type:'model',name:e.target.value});
function drag(event,isHeld){const rect=canvas.getBoundingClientRect();send({type:'drag',x:(event.clientX-rect.left)/rect.width*512,y:(event.clientY-rect.top)/rect.height*512,held:isHeld});}
canvas.onpointerdown=e=>{held=true;canvas.setPointerCapture(e.pointerId);drag(e,true);};canvas.onpointermove=e=>{if(held)drag(e,true);};canvas.onpointerup=e=>{held=false;drag(e,false);};canvas.onpointercancel=e=>{held=false;drag(e,false);};
canvas.onkeydown=e=>{if(!state)return;const delta={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]}[e.key];if(delta){e.preventDefault();send({type:'drag',x:state.block[0]+delta[0],y:state.block[1]+delta[1],held:false});}};
</script></html>
